[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextbench"
version = "0.1.0"
description = "A benchmark for what an agent keeps, updates, and offloads under context pressure"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["benchmark", "agents", "context", "evaluation", "long-horizon"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Exact o200k_base token counts. Without it the package falls back to a character
# estimate, which every reward and gate reports as its token method.
tokenizer = ["tiktoken>=0.7"]
# Container-based execution (phase 2).
harbor = ["harbor>=0.16"]
# `contextbench export-hf`: the Hugging Face dataset layout.
hf = ["pyarrow>=14"]
dev = ["pytest>=7.4"]

[project.scripts]
contextbench = "contextbench.cli:main"

[tool.setuptools.packages.find]
include = ["contextbench*"]

[tool.setuptools.package-data]
contextbench = ["tasks/*/scaffold.md", "configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"
markers = [
  "slow: builds and installs a wheel (about 30 s)",
  "needs_o200k: exact o200k_base token counts; skipped when tiktoken cannot load o200k_base",
]
