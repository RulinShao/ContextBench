[metadata]
author_name = "contextbench"
difficulty = "medium"
category = "context-management"
tags = ["context-management", "contextbench", "needle-retention", "selective-retention"]
contextbench_family = "needle_retention"
contextbench_budget_tokens = 32768
contextbench_reserve_tokens = 2048
contextbench_pressure = 0.484
contextbench_feasible = true
contextbench_regime = "sub-budget"
contextbench_stream_count = 4
contextbench_stream_sha256 = "c1fcc9891281e7e83f2e01566811652ddc38907fda5fd366fc294d1840e8287f"
instance_alpha_nominal = 0.02734259532958912
instance_approx_chunk_tokens = 3383
instance_approx_input_tokens = 13532
instance_approx_kept_tokens = 370
instance_chunks = 4
instance_filler_lines_per_chunk = 140
instance_n_answer_lines = 16
instance_n_source_lines = 576
instance_needles_per_chunk = 4
instance_seed = 46
instance_task_family = "needle_retention"
instance_words_per_line = 10
contextbench_verifier = "contextbench.harbor.verifiers:ContextBenchVerifier"

[verifier]
# Grade on the host: --verifier contextbench.harbor.verifiers:ContextBenchVerifier
# (tests/test.sh only refuses). "shared": the host verifier needs no container.
timeout_sec = 600.0
environment_mode = "shared"

[agent]
timeout_sec = 14400.0

[environment]
docker_image = "python:3.12-slim"
workdir = "/app"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
# Harbor's default, stated explicitly. Agents that run inside the container
# (codex, mini-swe-agent) reach the model endpoint from it, and Singularity /
# Apptainer cannot enforce "no-network" or "allowlist" (Harbor refuses such a
# task there). Host-side harnesses need no network in the container: where the
# provider enforces it, set network_mode = "no-network" for them.
network_mode = "public"

[environment.env]
CONTEXTBENCH_STREAM_COUNT = "4"
CONTEXTBENCH_STREAM_SHA256 = "c1fcc9891281e7e83f2e01566811652ddc38907fda5fd366fc294d1840e8287f"
CONTEXTBENCH_STREAM_PATH = "/app/stream/chunks.jsonl"
