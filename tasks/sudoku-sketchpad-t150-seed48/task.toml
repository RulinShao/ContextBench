[metadata]
author_name = "contextbench"
difficulty = "medium"
category = "context-management"
tags = ["context-management", "contextbench", "sudoku", "state-update"]
contextbench_family = "sudoku_sketchpad"
contextbench_budget_tokens = 32768
contextbench_reserve_tokens = 2048
contextbench_pressure = 11.0
contextbench_feasible = true
contextbench_regime = "pressure"
contextbench_stream_count = 150
contextbench_stream_sha256 = "a6f64ae09226b5bc9b61e07a9b9826e6f7c76e51a39ae89db0feff5d6e057d87"
instance_approx_actions_tokens = 7810
instance_approx_grid_tokens = 581
instance_approx_per_action_tokens = 52
instance_boards = 1
instance_box = 4
instance_givens = 90
instance_n_cells = 256
instance_n_turns = 150
instance_seed = 48
instance_side = 16
instance_task_family = "sudoku_sketchpad"
contextbench_verifier = "contextbench.harbor.verifiers:ContextBenchVerifier"

[verifier]
# Grade on the host: --verifier contextbench.harbor.verifiers:ContextBenchVerifier
# (tests/test.sh only refuses). "separate": Harbor stops the agent's container
# before verifying, so nothing the agent started can touch the verifier dir.
timeout_sec = 600.0
environment_mode = "separate"

[agent]
timeout_sec = 14400.0

[environment]
docker_image = "python:3.12-slim"
workdir = "/app"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096
# Harbor's default, stated explicitly. Agents that run inside the container
# (codex, mini-swe-agent) reach the model endpoint from it, and Singularity /
# Apptainer cannot enforce "no-network" or "allowlist" (Harbor refuses such a
# task there). Host-side harnesses need no network in the container: where the
# provider enforces it, set network_mode = "no-network" for them.
network_mode = "public"

[environment.env]
CONTEXTBENCH_STREAM_COUNT = "150"
CONTEXTBENCH_STREAM_SHA256 = "a6f64ae09226b5bc9b61e07a9b9826e6f7c76e51a39ae89db0feff5d6e057d87"
CONTEXTBENCH_STREAM_PATH = "/app/stream/chunks.jsonl"
